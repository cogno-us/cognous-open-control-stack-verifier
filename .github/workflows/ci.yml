name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The runner image is pinned (not `ubuntu-latest`). Third-party actions are pinned by commit SHA
# with the release tag in a comment; the SHAs are the ones the ergonomics repository uses.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (development tooling only; the package has no runtime dependency)
        run: python -m pip install -e ".[dev]"
      - name: make check (lint, strict types, tests with sockets off and the 80% coverage floor)
        run: make check
